MiscUnhookError=Hi ha hagut un error desactivant AltSnap. Açò probablement ha passat perquè Windows ja ha desactivat els ganxos d'AltSnap.\n\nSi aquesta és la primera vegada que açò passa, pots ignorar-ho sense problema i continuar usant AltSnap.\n\nSi açò passa repetidament, pots llegir al wiki de la web com previndre que açò torne a passar (cerca 'AltSnap mysteriously stops working' en la pàgina de "Quant a").
