MiscUnhookError=Houve um erro ao desabilitar o AltSnap. Isto foi provavelmente causado pelo Windows ter alterados as injeções (hooks) do AltSnap.\n\nSe é a primeira vez que isto acontece, você pode ignorar esta mensagem com segurança e continuar a usar o AltSnap.\n\nSe isto acontece repetidamente, você pode ler em nossa wiki (em inglês) como evitar a repetição deste erro (procure por "AltSnap mysteriously stops working" na página "About").
