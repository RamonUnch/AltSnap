MiscUnhookError=En feil oppstod ved deaktivering av AltSnap. Dette skyldes mest sannsynlig vinduer som allerede har deaktivert AltSnaps hektinger.\n\nHvis dette er første gangen du ser denne meldingen kan du trygt ignorere den og fortsette å bruke AltSnap.\n\nHvis dette skjer gjentatte ganger kan du lese wikien på nettsiden for hvordan du kan forhindre at dette skjer igjen (se etter "AltSnap mysteriously stops working" på About-siden).
