MiscUnhookError=Hubo un error al desactivar AltSnap. La causa más probable es que Windows ya haya desactivado las intercepciones de AltSnap.\n\nSi es la primera vez que ocurre, puedes ignorarlo y seguir usando AltSnap.\n\nSi esto ocurre repetidamente, puedes leer en el sitio web cómo evitar que esto ocurra de nuevo (busque 'AltSnap misteriosamente deja de funcionar' en la documentación).
