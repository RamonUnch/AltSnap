MiscUnhookError=Il y a eu une erreur qui a désactivé AltSnap. Cela est probablement dû au fait que Windows avait déjà désactivé son hook.\n\nSi c'est la première fois que cela se produit, vous pouvez l'ignorer en toute sécurité et continuer à utiliser AltSnap.\n\nSi cela se reproduit, vous pouvez lire sur le wiki du site comment l'empêcher (chercher 'AltSnap mysteriously stops working' sur la page About).
