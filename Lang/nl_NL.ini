MiscUnhookError=Er is een fout opgetreden bij het uitschakelen van AltSnap. Dit is waarschijnlijk veroorzaakt doordat AltSnap al door Windows is uitgeschakeld.\n\nAls dit de eerste keer is dat dit gebeurd, kunt u dit veilig negeren en doorgaan met het gebruik van AltSnap.\n\nAls dit vaker gebeurd, kunt u op de wiki op de website lezen hoe u kunt voorkomen dat dit opnieuw zal gebeuren (zoek naar 'AltSnap mysteriously stops working' op de 'About' pagina).
