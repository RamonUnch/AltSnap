MiscUnhookError=Houbo un erro deshabilitando AltSnap. A causa máis probable é que Windows deshailitase os ganchos de AltSnap.\n\nSe ésta é a primeira vez que acontece, pode ignoralo e continuar usando AltSnap.\n\nSe esto ocurre habitualmente, pódese ler na wiki do sitio web cómo prevenir este comportamiento (hai que buscar 'AltSnap mysteriously stops working' na páxina de About).
